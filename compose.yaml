services:
  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
    ports:
      - "127.0.0.1:8080:80"
    depends_on:
      backend:
        condition: service_healthy

  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
    environment:
      HOST: 0.0.0.0
      PORT: "8000"
      DB_PATH: /data/applications.sqlite3
      SCORING_URL: http://scoring:8001
    volumes:
      - backend_data:/data
    depends_on:
      scoring:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=2)"]
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 5s

  scoring:
    build:
      context: .
      dockerfile: Dockerfile.scoring
    environment:
      HOST: 0.0.0.0
      PORT: "8001"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8001/health', timeout=2)"]
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 5s

volumes:
  backend_data:
