name: Backend CI

on:
  push:
    paths:
      - 'backend/**'
      - 'scoring/contracts/**'
      - '.github/workflows/backend.yml'
  pull_request:
    paths:
      - 'backend/**'
      - 'scoring/contracts/**'
      - '.github/workflows/backend.yml'
  workflow_dispatch:

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Backend unit tests
        working-directory: backend
        run: python -m unittest discover -s tests -v
      - name: Validate scoring contract
        run: |
          python -m json.tool backend/contracts/scoring.schema.json > /dev/null
          cmp backend/contracts/scoring.schema.json scoring/contracts/scoring.schema.json
